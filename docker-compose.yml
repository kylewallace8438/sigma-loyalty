# Usage (see docs/SERVER.md):
#   docker compose --profile dev up --build      # HMR dev server   -> http://localhost:${APP_PORT:-3000}
#   docker compose --profile prod up -d --build  # production build -> http://localhost:${APP_PORT:-3000}
#   docker compose up -d mysql                   # database only (run the app on the host)
# Point your Cloudflare tunnel at http://localhost:${APP_PORT:-3000}. Run only one app profile at a time.

x-app: &app
  env_file: .env
  environment:
    # Inside the compose network the database is reachable by service name
    DATABASE_HOST: mysql
    DATABASE_PORT: "3306"
    PORT: "3000"
  ports:
    - "127.0.0.1:${APP_PORT:-3000}:3000"
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    container_name: sigma-loyalty-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-sigma_loyalty}
      MYSQL_USER: ${DATABASE_USER:-sigma}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-sigma}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DATABASE_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app-dev:
    <<: *app
    profiles: [dev]
    container_name: sigma-loyalty-app-dev
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      # Keep the container's (Alpine/musl) node_modules instead of the host's
      - app-node-modules:/app/node_modules

  app:
    <<: *app
    profiles: [prod]
    container_name: sigma-loyalty-app
    build:
      context: .
      target: prod
    volumes:
      - ./logs:/app/logs

volumes:
  mysql-data:
  app-node-modules:
